<!-- n8n 监控代码 V5.0 (带标题+IPv6支持) -->
<script>
window.addEventListener('load', function() {
    var webhookUrl = 'http://123.57.25.132:5678/webhook/visit'; 

    // Cloudflare 接口 (支持 IPv4 和 IPv6)
    fetch('https://www.cloudflare.com/cdn-cgi/trace') 
        .then(response => response.text())
        .then(data => {
            var ipRegex = /ip=(.*)/;
            var match = data.match(ipRegex);
            var userIp = match ? match[1] : 'IP解析失败';
            sendToN8n(userIp);
        })
        .catch(e => {
            // 备用方案
            trySohuFallback();
        });

    function trySohuFallback() {
         var script = document.createElement('script');
         script.src = 'http://pv.sohu.com/cityjson?ie=utf-8';
         script.onload = function() {
             if (typeof returnCitySN !== 'undefined') {
                 sendToN8n(returnCitySN.cip);
             } else {
                 sendToN8n('获取失败');
             }
         };
         document.body.appendChild(script);
    }

    function sendToN8n(userIp) {
        var isMobile = /Mobile|Android|iPhone/i.test(navigator.userAgent);
        fetch(webhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                url: window.location.href,
                title: document.title,      // <--- 新增：获取文章标题
                referrer: document.referrer || '直接访问',
                device: isMobile ? '手机 📱' : '电脑 💻',
                agent: navigator.userAgent,
                ip: userIp
            })
        }).catch(e => {});
    }
});
</script>
