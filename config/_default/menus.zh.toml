# -- Main Menu --
# 主导航菜单：显示在页面顶部的头部（Header）
# 每个 [[main]] 代表一个菜单项
# 支持多级嵌套（通过 parent 字段）
# 文档参考：https://blowfish.page/docs/menus/

# 可用的字段说明：
#   name      = 显示的文字（必填）
#   pageRef   = 指向站内页面（如 posts、tags、about）（推荐）
#   url       = 外部链接（例如 https://github.com）
#   title     = 鼠标悬停提示（可选）
#   weight    = 排序权重（数字越小越靠前，默认按字母排序）
#   parent    = 父菜单名称（用于创建下拉子菜单）
#   identifier = 自定义 ID（用于 CSS 样式或 JS 控制）

# ==================== 示例：完整主菜单 ====================

# 主菜单
[[main]]
  name = "首页"
  pageRef = "/"
  weight = 10

