# 是否禁用当前语言配置
# 如果设置为 true，则该语言不会在站点中启用（多语言站点中用于临时关闭某个语言）
disabled = false

# 语言代码（ISO 639-1 标准），用于标识语言
# 例如：en（英语）、zh（中文）、fr（法语）等
# Hugo 在生成 URL、内容切换时会使用这个代码
languageCode = "zh"

# 语言的显示名称（人类可读）
# 正确示例：
#   - 英文：languageCode = "en", languageName = "English"
#   - 中文：languageCode = "zh", languageName = "中文" 或 "Chinese"
languageName = "Chinese"

# 语言权重，用于多语言站点中决定默认语言的优先级
# 数值越小越优先（1 > 2 > 3）
# 通常主语言设为 1，其他翻译语言设为更高值
weight = 1

# 站点标题（会显示在浏览器标签、导航栏等位置）
# 支持多语言站点中为不同语言设置不同标题
title = "Weidong's Blok"

# ==================== [params] 区块 ====================
# 这是 Hugo 主题（这里是 Blowfish 主题）的自定义参数区域
# 所有 [params] 下的配置项都会传递给主题模板使用
[params]
  # 前端语言切换菜单中显示的名称（通常简短）
  # 例如：EN, ZH, FR
  displayName = "ZH"

  # ISO 语言代码（冗余？与上面的 languageCode 重复）
  # 某些主题可能在这里再次定义，用于模板判断
  isoCode = "en"

  # 是否为从右到左（RTL）书写的语言
  # 例如：阿拉伯语 (ar)、希伯来语 (he) 需要 rtl = true
  # 英文、中文等从左到右，保持 false
  rtl = false

  # 日期格式化模板（基于 Go 的 time.Format 语法）
  # 参考：https://go.dev/src/time/format.go
  # 常见格式：
  #   "2 January 2006"  →  2 January 2006
  #   "2006-01-02"      →  2025-04-05
  #   "Jan 2, 2006"     →  Apr 5, 2025
  dateFormat = "2 January 2006"

  # 站点主 Logo 图片路径（相对 public/ 或 static/ 目录）
  # 当前被注释掉了，主题会使用默认或不显示
  # logo = "img/logo.png"

  # 备用 Logo（例如深色模式下使用）
  # secondaryLogo = "img/secondary-logo.png"

  # 站点描述（用于 SEO 的 meta description）
   description = "Weidong's Blok"

  # 版权信息（显示在页脚）
  # 支持 Markdown 语法，如表情符号 :thinking_face:
  # copyright = "Copy, _right?_ :thinking_face:"

# ==================== 作者信息区块（可选）===================
# Blowfish 主题支持配置作者信息，显示在文章、关于页等位置
# 以下整个区块被注释掉了，若需启用请取消注释并填写
 [params.author]
   name = "Weidong's Blok"                    # 作者姓名
   email = "weidong_321@163.com"            # 邮箱（用于联系表单等）
   image = "img/blowfish_logo.png"            # 作者头像
   imageQuality = 96                          # 图片质量（1-100），仅对 WebP 等有效
   headline = "他山之石可以攻玉"                # 一句话介绍（显示在头像下方）
   bio = "欢迎访问我的技术博客，记录工具、踩坑、系统运维经验。"             # 详细自我介绍（支持 Markdown）

